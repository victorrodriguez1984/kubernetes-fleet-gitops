apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-kpc
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-kpc
  path: ./platform-fleet-poc/apps/overlays/control-plane
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure
