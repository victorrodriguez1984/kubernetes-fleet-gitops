apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apps deployed only to control-plane (hub) clusters.
#
# apps/base/ is the full catalog. This overlay decides which of those apps
# the control-plane group gets. Candidates discussed so far: keycloak,
# seaweedfs, external-secrets-operator - none exist under apps/base/ yet,
# so there is nothing to reference here for now.
#
# Once an app is added under apps/base/<name>/, list it below, e.g.:
#   resources:
#     - ../../base/keycloak
#     - ../../base/seaweedfs
#     - ../../base/external-secrets-operator
resources: []
