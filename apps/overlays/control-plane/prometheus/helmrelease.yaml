apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "90.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-kpc
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    prometheus:
      prometheusSpec:
        retention: 24h
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    
    grafana:
      enabled: true
      adminPassword: "prometheus"
      persistence:
        enabled: true
        size: 1Gi
      # Disable default datasource provisioning to avoid conflicts
      datasources: {}
      datasourceProviders: {}
      # Manually provision only our Prometheus datasource
      provisioning:
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus-kube-prometheus-prometheus:9090
              access: proxy
              isDefault: true
    
    alertmanager:
      enabled: false
