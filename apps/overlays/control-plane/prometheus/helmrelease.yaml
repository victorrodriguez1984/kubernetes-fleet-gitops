apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "90.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-kpc
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    prometheus:
      prometheusSpec:
        enableRemoteWriteReceiver: true
        retention: 24h
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        # Annotation-based discovery for services in finops-opencost (e.g. the
        # hub's own OpenCost), mirroring the spoke prometheus-agent's
        # kubernetes-service-endpoints job. No ServiceMonitor CRD involved on
        # purpose (avoids Prometheus Operator selector-matching issues).
        additionalScrapeConfigs:
          - job_name: kubernetes-service-endpoints
            honor_labels: true
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - finops-opencost
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                action: keep
                regex: true
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape_slow]
                action: drop
                regex: true
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
                action: replace
                target_label: __scheme__
                regex: (https?)
              - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
                action: replace
                target_label: __address__
                regex: (.+?)(?::\d+)?;(\d+)
                replacement: $1:$2
              - action: labelmap
                regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
                replacement: __param_$1
              - action: labelmap
                regex: __meta_kubernetes_service_label_(.+)
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: namespace
              - source_labels: [__meta_kubernetes_service_name]
                action: replace
                target_label: service
              - source_labels: [__meta_kubernetes_pod_node_name]
                action: replace
                target_label: node
            metric_relabel_configs:
              - target_label: cluster_id
                replacement: azr-cru-0001-k01
                action: replace

    # Tag the hub's own locally-scraped metrics with cluster_id, since
    # Prometheus externalLabels only apply to data leaving via remote_write,
    # not to metrics scraped and queried locally on this same instance.
    kube-state-metrics:
      prometheus:
        monitor:
          metricRelabelings:
            - targetLabel: cluster_id
              replacement: azr-cru-0001-k01
              action: replace

    prometheus-node-exporter:
      prometheus:
        monitor:
          metricRelabelings:
            - targetLabel: cluster_id
              replacement: azr-cru-0001-k01
              action: replace

    # kubelet/cAdvisor is a third scrape source (managed directly by this
    # chart, not by the kube-state-metrics/node-exporter subcharts above) that
    # also needs the cluster_id stamp. Its default drop rules are replicated
    # here because Helm replaces lists wholesale rather than merging them.
    kubelet:
      serviceMonitor:
        cAdvisorMetricRelabelings:
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_memory_(mapped_file|swap)'
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_(file_descriptors|tasks_state|threads_max)'
          - sourceLabels: [__name__, scope]
            action: drop
            regex: 'container_memory_failures_total;hierarchy'
          - sourceLabels: [__name__, interface]
            action: drop
            regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_spec.*'
          - sourceLabels: [id, pod]
            action: drop
            regex: '.+;'
          - targetLabel: cluster_id
            replacement: azr-cru-0001-k01
            action: replace

    grafana:
      enabled: true
      adminPassword: "prometheus"
      persistence:
        enabled: true
        size: 1Gi
      # Disable default datasource provisioning to avoid conflicts
      datasources: {}
      datasourceProviders: {}
      # Manually provision only our Prometheus datasource
      provisioning:
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus-kube-prometheus-prometheus:9090
              access: proxy
              isDefault: true
    
    alertmanager:
      enabled: false
