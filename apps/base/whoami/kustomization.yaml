apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - deployment.yaml
  - service.yaml

# Tag is pinned here, not in deployment.yaml, so it can be bumped in one
# place. Source of truth for WHICH tag: catalog/whoami.yaml
# (validated.<group>) - kept in sync by catalog/promote-app-release.sh, not
# hand-edited.
images:
  - name: traefik/whoami
    newTag: "v1.11.0"
