apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# "control-plane" is the infrastructure profile for hub clusters.
# Includes universal base resources (platform-system, apps namespaces)
# plus control-plane specific resources (monitoring, finops-opencost namespaces + HelmRepositories)
resources:
  - ../../base
  - ./namespaces.yaml
  - ../../sources
