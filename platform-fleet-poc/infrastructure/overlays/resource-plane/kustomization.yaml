apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# "resource-plane" is the infrastructure profile shared by all spoke
# clusters. It currently only creates baseline namespaces + RBAC.
#
# To add infra common to every resource-plane cluster (e.g. cert-manager,
# External Secrets Operator install), add the manifests/HelmReleases here
# and list them under `resources`.
resources:
  - ../../base
  - ../../sources
