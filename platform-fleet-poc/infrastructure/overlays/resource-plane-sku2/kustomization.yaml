apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# "sku2" is a second sizing/hardware profile within the "resource-plane"
# group - illustrative for now (no cluster in clusters-config.yaml is sku2
# yet), added to prove the extension point works before it's actually
# needed. Infra-wise it's still a pass-through; see
# apps/overlays/resource-plane-sku2/kustomization.yaml for the concrete
# difference (higher replica count for whoami).
#
# To onboard a real sku2 cluster: set `sku: sku2` on its entry in
# clusters-config.yaml and point its infrastructure.yaml `path` at
# .../overlays/resource-plane-sku2 instead of .../resource-plane-sku1.
resources:
  - ../resource-plane
