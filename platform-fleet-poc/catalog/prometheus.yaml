# App release catalog: Prometheus (kind: helm)
#
# Prometheus is deployed via Helm chart: prometheus-community/kube-prometheus-stack
# Chart version is pinned here, not per-group - every cluster in the same group
# runs the same validated release.
#
# "Validated" means this release has been reconciled and passed
# liveness/readiness checks on a non-prod cluster in that group.

kind: helm
chart_repo: prometheus-community
chart_url: https://prometheus-community.github.io/helm-charts

releases:
  "2026.07.1":
    chart_name: kube-prometheus-stack
    chart_version: "90.0.0"
    # Values are stored in apps/overlays/control-plane/prometheus/helmrelease.yaml

# Which release each group is currently pinned to
validated:
  control-plane: "2026.07.1"
  resource-plane: "2026.07.1"
