apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apps deployed to every cluster in the "resource-plane" group (spokes).
#
# apps/base/ is the full catalog (all apps that CAN be deployed anywhere).
# This overlay decides which of those the resource-plane group actually gets.
#
# - whoami: first app used to validate the full GitOps flow end-to-end.
# - podinfo: already in the catalog (apps/base/podinfo) but not enabled here;
#   add it below if/when this group needs it.
# - external-secrets-operator: still a placeholder (apps/base/external-secrets-operator),
#   not enabled anywhere yet - add it here once it's actually defined.
resources:
  - ../../base
