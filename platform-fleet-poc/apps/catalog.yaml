# Applications catalog (metadata only).
#
# This file documents what exists under apps/base/.
# Flux deployment is controlled by overlays only.

catalogVersion: 1

apps:
  - name: podinfo
    status: ready
    category: demo
    namespace: apps
    profiles:
      - resource-plane-sku1
    description: Demo workload for basic rollout/readiness validation.

  - name: whoami
    status: ready
    category: demo
    namespace: apps
    profiles:
