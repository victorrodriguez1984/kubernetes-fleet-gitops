    namespace: finops
    profiles:
      - resource-plane-sku1
    description: OpenCost collector datasource on spoke (no local Prometheus dependency).

  - name: external-secrets-operator
    status: placeholder
    category: security
    namespace: external-secrets
    profiles: []
    description: Placeholder only; base folder exists but no deployable resources yet.
