# Platform Fleet POC - Clusters Configuration
#
# Decision summary
# - Single cluster inventory in one file (no per-branch inventory divergence).
# - Branch-only promotion:
#     - non-prod clusters track `git_ref: flux`
#     - prod clusters track `git_ref: flux-prod`
# - `enabled` and `install_flux` are onboarding flags for onboard-clusters.sh,
#   not runtime rollout switches for already-bootstrapped clusters.
# - Runtime reconciliation always follows the in-cluster GitRepository (`flux-kpc`).
#
# Field semantics
# - `group`: WHAT runs (must match overlays under infrastructure/apps).
# - `sku`: size/profile inside a group (flat naming: <group>-<sku>, not nested).
# - `environment`: maps cluster path automatically:
#     - `prod` -> clusters/prod/<name>/
#     - anything else -> clusters/non-prod/<name>/
# - `git_ref_type`: always `branch`.
# - `git_ref`: release channel for that cluster (`flux` or `flux-prod`).
# - `install_flux`: keep `true` for real managed clusters by default; use `false`
#   only for placeholders or intentionally unmanaged bootstrap.
#
# Versioning
# - Flux controller version is resolved by `group` from catalog/flux.yaml,
#   not per-cluster in this file.

clusters:
  - name: kind-dev
    enabled: false
    environment: dev
    group: resource-plane
    sku: sku1
    git_ref_type: branch
    git_ref: flux
    kubeconfig_context: kind-flux-fleet-poc
    install_flux: true
    flux_namespace: flux-kpc
  - name: azr-cru-0001-k01
    enabled: true
    environment: dev
    group: control-plane
    git_ref_type: branch
    git_ref: flux
    kubeconfig_context: hub 
    install_flux: true
    flux_namespace: flux-kpc
  - name: azr-dev-0011-k01
    enabled: true
    environment: dev
    sku: sku1
    group: resource-plane
    git_ref_type: branch
    git_ref: flux
    kubeconfig_context: spoke 
    install_flux: true
    flux_namespace: flux-kpc
  - name: azr-dev-0055-k01
    enabled: true
    environment: dev
    sku: sku1
    group: resource-plane
    git_ref_type: branch
    git_ref: flux
    kubeconfig_context: spoke2 
    install_flux: true
    flux_namespace: flux-kpc

