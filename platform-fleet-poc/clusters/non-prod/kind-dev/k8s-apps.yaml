apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-kpc
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-kpc
  path: ./platform-fleet-poc/apps/overlays/resource-plane-sku1
  # NOTE: resource-plane-sku1 is a shared overlay used by multiple clusters.
  # Substitutions below are cluster-specific and must be set in each cluster's
  # own clusters/*/<cluster>/k8s-apps.yaml (not in the shared overlay).
  # Temporary approach: keeping per-cluster substitutions in Flux postBuild.
  # TODO: move this feature to CI/CD so cluster-specific values are generated
  # in Git from clusters-config.yaml instead of being maintained manually here.
  postBuild:
    substitute:
      SPOKE_CLUSTER_ID: kind-dev
      SPOKE_ENVIRONMENT: dev
      HUB_PROMETHEUS_WRITE_URL: https://REPLACE_WITH_HUB_PROMETHEUS_WRITE_URL/api/v1/write
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure
