# App release catalog: OpenCost (kind: helm)
#
# OpenCost is deployed via Helm chart: opencost/opencost
# Chart version is pinned here, not per-group - every cluster in the same group
# runs the same validated release.
#
# "Validated" means this release has been reconciled and passed
# liveness/readiness checks on a non-prod cluster in that group.

kind: helm
chart_repo: opencost
chart_url: https://opencost.github.io/opencost-helm-chart

releases:
  "2026.07.1":
    chart_name: opencost
    chart_version: "2.5.30"
    # Values are stored in apps/overlays/control-plane/opencost/helmrelease.yaml

# Which release each group is currently pinned to
validated:
  control-plane: "2026.07.1"
