# App release catalog: whoami (kind: image)
#
# Deployed as a plain Kubernetes Deployment (apps/base/whoami), not via a
# Helm chart/HelmRelease - see catalog/podinfo.yaml's header for the
# full `kind: image` vs `kind: helm` explanation.
#
# "Validated" means this release has been reconciled (Kustomization
# Ready=True) and passed liveness/readiness checks on a non-prod cluster in
# that group - same discipline as catalog/flux.yaml.
kind: image
registry: docker.io # public registry today - see README "Extending the catalog pattern to applications"

releases:
  "2026.07.1":
    repository: traefik/whoami
    tag: "v1.11.0"
    # digest: sha256:...   # switch tag -> digest here once we want an immutable, non-floating pin

# whoami is the app currently enabled on the resource-plane group
# (apps/overlays/resource-plane) - this is the version its clusters
# actually run today.
validated:
  resource-plane: "2026.07.1"
  control-plane: "2026.07.1"
